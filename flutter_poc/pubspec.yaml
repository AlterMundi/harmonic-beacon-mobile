name: harmonic_beacon
description: Harmonic Beacon — Synchronized immersive audio experiences
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  # Audio & WebRTC
  livekit_client: ^2.6.0
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  # State management
  provider: ^6.1.2
  # Authentication (Zitadel OIDC)
  flutter_appauth: ^7.0.0
  flutter_secure_storage: ^9.2.2
  # Networking
  http: ^1.2.0
  # Date formatting
  intl: ^0.19.0
  # Utilities
  wakelock_plus: ^1.2.8

dependency_overrides:
  # package_info_plus 9.0.0 uses flutter.compileSdkVersion in its library
  # build.gradle which is unavailable in older Gradle contexts.
  package_info_plus: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
